<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4c3732">
<title>طلب سالسا</title>
<style>
:root{--bg:#fcfdf8;--bg2:#f5f2ea;--card:#fff;--line:#e6dfd8;--ink:#3e3130;--muted:#787471;--g:#73a99b;--gt:#4f8577;--bar:#4c3732;--err:#da1f32;--chip:#f5f2ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:96px}
header{background:var(--bar);color:#fcfdf8;padding:18px 16px 16px}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:#cdbfb9;font-size:14px}
main{max-width:640px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h2{margin:0 0 10px;font-size:16px}
label{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
input[type=text],input[type=tel],input[type=search]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--g);border-color:var(--g)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.status{margin-top:10px;padding:9px 12px;border-radius:10px;background:#e7f1ee;color:#2f5f52;font-size:14px;display:none}
.status.show{display:block}.status.err{background:#f8e8e9;color:var(--err)}
.cat{margin:10px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.cat>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--bg2)}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .cnt{font-size:12px;font-weight:700;background:var(--g);color:#fff;border-radius:99px;padding:1px 9px;margin-inline-start:8px;display:none}
.cat>summary .cnt.on{display:inline-block}
.cat>summary:after{content:"+";font-size:20px;color:var(--gt)}
.cat[open]>summary:after{content:"−"}
.cnote{padding:8px 14px 0;font-size:13px;color:var(--muted)}
.it{padding:12px 14px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.nm{font-weight:600}
.new{display:inline-block;background:var(--err);color:#fff;font-size:11px;border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.vs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.v{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:6px 10px;font:inherit;color:var(--ink);cursor:pointer;min-height:40px}
.v b{font-weight:700}
.v.on{border-color:var(--g);background:#e7f1ee}
.v.off{opacity:.4;cursor:default}
.q{display:none;align-items:center;gap:2px}
.v.on .q{display:inline-flex}
.q span{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:var(--g);color:#fff;font-weight:700}
.q em{font-style:normal;min-width:20px;text-align:center;font-weight:700}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.bar .t{line-height:1.25}.bar .t small{color:var(--muted);display:block;font-size:12px}.bar .t b{font-size:19px}
button.main{background:var(--g);color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;padding:12px 20px;cursor:pointer;min-height:46px}
button.main:disabled{opacity:.5}
button.sec{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:12px;font:inherit;padding:10px 16px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(40,28,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px}
.sheet .ok{color:var(--gt);font-weight:700}
.ln{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 0 4px}
.empty{color:var(--muted);text-align:center;padding:14px}
@media (prefers-color-scheme:dark){
:root{--bg:#3b2d29;--bg2:#4a3a35;--card:#443530;--line:#66524b;--ink:#fcfdf8;--muted:#cdbfb9;--chip:#574540;--gt:#8cc2b3;--err:#ef6b7c}
header{background:#2f2320}.v.on{background:#3d5650}.status{background:#35504a;color:#cfe6df}.status.err{background:#5a3037;color:#ffc1c9}
input[type=text],input[type=tel],input[type=search],textarea{background:#3b2d29}
}
</style>
</head>

  if(c.n)h+='<div class="cnote">'+esc(c.n)+'</div>';
  c.i.forEach(function(x){
   h+='<div class="it" data-s="'+esc((x.n+' '+(x.d||'')+' '+c.t).toLowerCase())+'"><div class="nm">'+esc(x.n)+(x.new?'<span class="new">جديد</span>':'')+'</div>';
   if(x.d)h+='<div class="ds">'+esc(x.d)+'</div>';
   h+='<div class="vs">';
   x.p.forEach(function(p,vi){
    var lab=c.s[vi];
    if(p==null){h+='<div class="v off">'+(lab?esc(lab)+' ':'')+'—</div>';return}
    h+='<div class="v" data-k="'+x.id+'|'+vi+'" role="button" tabindex="0">'+(lab?'<span>'+esc(lab)+'</span>':'')+'<b>'+p+'</b><span class="q"><span data-d="-1">−</span><em>1</em><span data-d="1">+</span></span></div>';
   });

  });

 });

}
function line(k){var a=k.split('|'),m=byId[a[0]];if(!m)return null;var p=m.x.p[+a[1]];if(p==null)return null;var lab=m.c.s[+a[1]];return{k:k,name:m.x.n+(lab?' ('+lab+')':''),cat:m.c.t,p:p,q:sel[k]}}
