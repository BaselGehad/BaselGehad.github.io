<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#5b3a29">
<title>المطاعم</title>
<style>
:root{--bg:#f6efe2;--bg2:#eadfc8;--card:#fffaf0;--line:#e3d6bd;--ink:#5b3a29;--muted:#8a7766;--g:#5f7a55;--gl:#8aa17f;--gt:#4d6844;--bar:#5b3a29;--err:#b3261e;--chip:#f1e8d4;--warm:#f4e3c8;--warmt:#9a6a2c;--ok:#e8efe2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Naskh Arabic','Noto Sans Arabic',system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:100px}
header{background:var(--bar);color:#fffaf0;padding:16px 16px 14px}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:#e6d6c3;font-size:14px}
header .back{display:inline-block;color:#e6d6c3;font-size:14px;margin-bottom:4px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card h2{margin:0 0 8px;font-size:16px}
label{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
input[type=text],input[type=tel],input[type=search],textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--gl);border-color:var(--gl)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.warn{margin:10px 0;font-size:14px;background:var(--warm);border-radius:12px;padding:10px 12px;color:var(--warmt)}
.status{margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--ok);color:var(--gt);font-size:14px;display:none}
.status.show{display:block}.status.err{background:#f8e1de;color:var(--err)}
.rc{display:flex;gap:12px;align-items:center;cursor:pointer}
.ic{width:46px;height:46px;border-radius:12px;background:var(--gl);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.ic.b{background:#b08968}
.rc h3{margin:0;font-size:17px}.rc p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tag{margin-inline-start:auto;font-size:12px;background:var(--ok);color:var(--gt);border-radius:20px;padding:3px 10px;white-space:nowrap}
.tag:empty{display:none}
.tag.o{background:var(--warm);color:var(--warmt)}.tag.x{background:#eee;color:#777}
.rc.soon{opacity:.75;cursor:default}
h4{margin:16px 4px 6px;font-size:15px;color:var(--gt)}
.hit{margin:8px 4px;font-size:13px;color:var(--muted)}
mark{background:var(--ok);color:inherit;border-radius:4px}
.hi{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.hi:last-child{border:0}
.tabs{display:flex;margin:10px 0;background:var(--bg2);border-radius:14px;padding:4px}
.tabs div{flex:1;text-align:center;padding:9px 4px;border-radius:11px;font-size:15px;cursor:pointer}
.tabs .on{background:var(--bar);color:#fffaf0}
.cat{margin:10px 0;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.cat>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--bg2)}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .cnt{font-size:12px;font-weight:700;background:var(--g);color:#fff;border-radius:99px;padding:1px 9px;margin-inline-start:8px;display:none}
.cat>summary .cnt.on{display:inline-block}
.cat>summary:after{content:"+";font-size:20px;color:var(--gt)}
.cat[open]>summary:after{content:"−"}
.cnote{padding:8px 14px 0;font-size:13px;color:var(--muted)}
.it{padding:12px 14px;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.nm{font-weight:600}
.new{display:inline-block;background:var(--err);color:#fff;font-size:11px;border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.ds{font-size:12.5px;color:var(--muted);margin-top:2px}
.vs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.v{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--chip);border-radius:12px;padding:6px 10px;font:inherit;color:var(--ink);cursor:pointer;min-height:40px}
.v b{font-weight:700}
.v.on{border-color:var(--gl);background:var(--ok)}
.v.off{opacity:.4;cursor:default}
.q{display:none;align-items:center;gap:2px}
.v.on .q{display:inline-flex}
.q span{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:8px;background:var(--g);color:#fff;font-weight:700}
.q em{font-style:normal;min-width:20px;text-align:center;font-weight:700}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:5}
.bar .t{line-height:1.25}.bar .t small{color:var(--muted);display:block;font-size:12px}.bar .t b{font-size:19px}
button.main{background:var(--g);color:#fff;border:0;border-radius:12px;font:inherit;font-weight:700;padding:11px 18px;cursor:pointer;min-height:44px}
button.main:disabled{opacity:.5}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;font:inherit;padding:10px 16px;cursor:pointer;min-height:44px}
button.dng{background:var(--card);color:var(--err);border:1px solid var(--line);border-radius:12px;font:inherit;padding:10px 16px;cursor:pointer;min-height:44px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btns button{flex:1}
.ord .t{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ord .d{font-size:12px;color:var(--muted);margin-top:2px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.tot{display:flex;justify-content:space-between;font-weight:800;padding:8px 0 0}
.empty{color:var(--muted);text-align:center;padding:18px}
.modal{position:fixed;inset:0;background:rgba(40,28,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px}
.hide{display:none!important}
@media (prefers-color-scheme:dark){
:root{--bg:#2b211c;--bg2:#3a2d26;--card:#362a24;--line:#58463c;--ink:#f6efe2;--muted:#c9b9a6;--chip:#45362e;--gt:#a9c49d;--ok:#3d4a37;--warm:#55412a;--warmt:#f0cf9c;--err:#ef8a80}
header,.bar{background:#241b17}.bar{background:#241b17}.status.err{background:#512a27}
input[type=text],input[type=tel],input[type=search],textarea{background:#2b211c}
}
</style>
</head>

  var soon=!r.menu;
  h+='<div class="card'+(q&&items.length?'':'')+'"><div class="rc'+(soon?' soon':'')+'" '+(soon?'':'data-r="'+r.id+'"')+'><div class="ic'+(soon?' b':'')+'">'+esc(r.name.charAt(0))+'</div><div><h3>'+hl(r.name,q&&nameHit?q:'')+'</h3><p>'+esc(r.sub)+'</p></div><span class="tag'+(soon?' o':'')+'">'+(soon?'قريبًا':r.count+' صنفًا')+'</span></div>';
  if(q&&items.length){h+='<div style="margin-top:8px">';items.slice(0,6).forEach(function(m){var p=m.x.p.filter(function(z){return z!=null});h+='<div class="hi" data-r="'+r.id+'"><span>'+hl(m.x.n,q)+'</span><span>'+(p.length?p[0]+(p.length>1?'+':''):'—')+'</span></div>'});if(items.length>6)h+='<div class="hit">و'+(items.length-6)+' أصناف أخرى</div>';h+='</div>'}
  h+='</div>';
 });
 if(q)h='<div class="hit">'+(n?n+' من المطاعم':'لا توجد نتائج')+' لـ "'+esc($('rq').value.trim())+'"</div>'+h;
 else h+='';
 $('rl').innerHTML=h;
}
$('rq').addEventListener('input',drawList);
$('rl').addEventListener('click',function(e){var t=e.target.closest('[data-r]');if(t){ident();go('rest',t.dataset.r)}});
/* ---------- restaurant menu ---------- */
function render(r){
 var h='';
 r.menu.forEach(function(c,ci){
  h+='<details class="cat"><summary><span>'+esc(c.t)+'<span class="cnt" id="cc'+ci+'"></span></span></summary>';
  if(c.n)h+='<div class="cnote">'+esc(c.n)+'</div>';
  c.i.forEach(function(x){
   h+='<div class="it" data-s="'+esc((x.n+' '+(x.d||'')+' '+c.t).toLowerCase())+'"><div class="nm">'+esc(x.n)+(x.new?'<span class="new">جديد</span>':'')+'</div>';
   if(x.d)h+='<div class="ds">'+esc(x.d)+'</div>';
   h+='<div class="vs">';
   x.p.forEach(function(p,vi){
    var lab=c.s[vi];
    if(p==null){h+='<div class="v off">'+(lab?esc(lab)+' ':'')+'—</div>';return}
    h+='<div class="v" data-k="'+x.id+'|'+vi+'" role="button" tabindex="0">'+(lab?'<span>'+esc(lab)+'</span>':'')+'<b>'+p+'</b><span class="q"><span data-d="-1">−</span><em>1</em><span data-d="1">+</span></span></div>';
   });
   h+='</div></div>';
  });
  h+='</details>';
 });
 $('menu').innerHTML=h;
}
function line(k){var r=R[cur],a=k.split('|'),m=r.by[a[0]];if(!m)return null;var p=m.x.p[+a[1]];if(p==null)return null;var lab=m.c.s[+a[1]];return{k:k,name:m.x.n+(lab?' ('+lab+')':''),cat:m.c.t,p:p,q:sel[k]}}
function lines(){return Object.keys(sel).map(line).filter(Boolean)}
function pendingOf(rid){return orders.filter(function(o){return o.restaurant==R[rid].name&&o.status=='قيد الطلب'})[0]}
function refresh(){
 if(!cur)return;
 var L=lines(),t=0,n=0;L.forEach(function(l){t+=l.p*l.q;n+=l.q});
 $('tot').textContent=money(t);
 $('cnt').textContent=n?('عدد الأصناف: '+n):'لم تختر شيئًا';
 var pend=!editId&&pendingOf(cur);
 $('gob').disabled=!n||!!pend;
 $('gob').textContent=editId?'حفظ التعديل':'أرسل الطلب';
 document.querySelectorAll('.v[data-k]').forEach(function(e){var q=sel[e.dataset.k]||0;e.classList.toggle('on',q>0);var em=e.querySelector('em');if(em)em.textContent=q||1});
 var cc={};L.forEach(function(l){var ci=l.k.split('|')[0].split('.')[0];cc[ci]=(cc[ci]||0)+l.q});
 R[cur].menu.forEach(function(c,ci){var e=$('cc'+ci);if(e){e.textContent=cc[ci]||'';e.classList.toggle('on',!!cc[ci])}});
 var eb=$('editb');
 if(editId){eb.className='card';eb.innerHTML='<b>تعديل طلب قيد الطلب</b><div class="btns"><button class="sec" id="ce">إلغاء التعديل</button></div>';$('ce').onclick=function(){editId=null;sel={};$('os').value='';saveSel();refresh()}}
 else if(pend){eb.className='card';eb.innerHTML='<div class="warn" style="margin:0">لديك طلب قيد الطلب من '+esc(R[cur].name)+'. أكّد استلامه أو عدّله أو ألغه قبل طلب جديد من نفس المطعم.</div><div class="btns"><button class="main" id="gp">افتح طلباتي</button></div>';$('gp').onclick=function(){go('orders')}}
 else eb.className='card hide';
 saveSel();
}
function saveSel(){ls('rest.sel.'+cur,JSON.stringify({sel:sel,os:$('os').value,edit:editId}))}
function status(msg,err){var s=$('st');s.textContent=msg||'';s.className='status'+(msg?' show':'')+(err?' err':'')}
function openRest(rid){
 cur=rid;var r=R[rid];sel={};editId=null;$('os').value='';$('q').value='';
 try{var s=JSON.parse(ls('rest.sel.'+rid)||'null');if(s){sel=s.sel||{};$('os').value=s.os||'';editId=s.edit||null}}catch(e){}
 Object.keys(sel).forEach(function(k){if(!line(k))delete sel[k]});
 render(r);show('rest');head(r.name,r.sub,'المطاعم');status('');
 if(phone().length>=10)loadOrders(false).then(function(){refresh()});
 refresh();window.scrollTo(0,0);
 if(history.replaceState)history.replaceState(null,'','#'+rid);
}
document.addEventListener('click',function(ev){
 var v=ev.target.closest('.v[data-k]');if(!v)return;
 var k=v.dataset.k,d=ev.target.closest('[data-d]');
 if(d){var q=(sel[k]||0)+(+d.dataset.d);if(q<=0)delete sel[k];else sel[k]=Math.min(q,50)}
 else{if(sel[k])delete sel[k];else sel[k]=1}
 refresh();
});
$('q').addEventListener('input',function(){
 var t=this.value.trim().toLowerCase();
 document.querySelectorAll('.cat').forEach(function(c){
  var any=false;c.querySelectorAll('.it').forEach(function(i){var m=!t||i.dataset.s.indexOf(t)>-1;i.style.display=m?'':'none';if(m)any=true});
  c.style.display=any?'':'none';if(t&&any)c.open=true;
 });
});
$('os').addEventListener('input',function(){saveSel()});
$('nm').addEventListener('input',ident);$('ph').addEventListener('input',ident);
/* ---------- send ---------- */
$('gob').addEventListener('click',function(){
 var name=$('nm').value.trim(),ph=phone(),L=lines();
 if(!name||ph.length<10||ph.length>13){status(!name?'اكتب اسمك في الصفحة الرئيسية.':'اكتب رقم موبايل صحيحًا في الصفحة الرئيسية.',true);var b=$('bk');window.scrollTo(0,0);return}
 if(!L.length)return;
 var total=0;L.forEach(function(l){total+=l.p*l.q});
 var payload={a:'save',id:editId||'',restaurant:R[cur].name,name:name,phone:ph,total:total,note:$('os').value.trim(),items:L.map(function(l){return{k:l.k,q:l.q,n:l.name,c:l.cat,p:l.p}})};
 var b=$('gob'),was=editId;b.disabled=true;b.textContent='جارٍ الحفظ...';
 api('POST',payload).then(function(r){
  if(!r||!r.ok){if(r&&r.error=='pending')throw new Error('pending');throw new Error('fail')}
  var rid=cur;sel={};$('os').value='';editId=null;ls('rest.sel.'+rid,null);
  $('sh').innerHTML='<h3>'+(was?'تم تحديث طلبك':'تم حفظ طلبك')+'</h3><div style="color:var(--muted)">'+esc(R[rid].name)+' · حالته قيد الطلب</div><div class="note">بعد ما يصلك الطلب افتح "طلباتي" واضغط "تم استلام الطلب" لينتقل إلى طلباتك القديمة.</div><div class="btns"><button class="main" id="gor">طلباتي</button></div>';
  $('md').classList.add('show');$('gor').onclick=function(){$('md').classList.remove('show');go('orders')};
 }).catch(function(e){
  status(e.message=='pending'?'لديك طلب قيد الطلب من هذا المطعم. أكّد استلامه أو ألغه أولًا.':'لم يتم الحفظ. تحقق من الاتصال وأعد المحاولة.',true);window.scrollTo(0,0);
  loadOrders(false).then(refresh);refresh();
 });
});
$('md').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
/* ---------- orders ---------- */
function loadOrders(draw){
 var p=phone();
 if(p.length<10){orders=[];if(draw)drawOrders();return Promise.resolve()}
 if(draw)ost('جارٍ تحميل طلباتك...');
 return api('GET',null,'a=get&phone='+encodeURIComponent(p)).then(function(r){
  if(!r||!r.ok)throw 0;orders=r.orders||[];loadedFor=p;if(draw){ost('');drawOrders()}updTag();
 }).catch(function(){if(draw)ost('تعذر الاتصال. حاول مرة أخرى.',true)});
}
function ost(m,err){var s=$('ost');s.textContent=m||'';s.className='status'+(m?' show':'')+(err?' err':'')}
function updTag(){var n=orders.filter(function(o){return o.status=='قيد الطلب'}).length;$('myot').textContent=n?n+' قيد الطلب':'';$('myot').className='tag'+(n?' o':'');$('myot').style.display=n?'':'none'}
function ordHTML(o){
 var t=0,h='<div class="card ord"><div class="t"><span>'+esc(o.restaurant)+'</span><span class="tag'+(o.status=='قيد الطلب'?' o':(o.status=='ملغي'?' x':''))+'">'+esc(o.status)+(o.status=='تم الاستلام'?' ✓':'')+'</span></div><div class="d">'+esc(o.created)+(o.closed?' · '+esc(o.closedLabel||'')+' '+esc(o.closed):'')+'</div><div style="margin-top:6px">';
 (o.items||[]).forEach(function(l){t+=l.p*l.q;h+='<div class="ln"><span>'+esc(l.n)+(l.q>1?' × '+l.q:'')+'</span><b>'+money(l.p*l.q)+'</b></div>'});
 h+='<div class="tot"><span>الإجمالي</span><span>'+money(o.total!=null?o.total:t)+'</span></div>';
 if(o.note)h+='<div class="note" style="white-space:pre-wrap">Open Space: '+esc(o.note)+'</div>';
 h+='</div>';
 if(o.status=='قيد الطلب')h+='<div class="btns"><button class="main" data-act="rcv" data-id="'+esc(o.id)+'">✓ تم استلام الطلب</button><button class="sec" data-act="edit" data-id="'+esc(o.id)+'">تعديل</button><button class="dng" data-act="cancel" data-id="'+esc(o.id)+'">إلغاء الطلب</button></div>';
 return h+'</div>';
}
function drawOrders(){
 $('tb1').className=tab==1?'on':'';$('tb2').className=tab==2?'on':'';
 var P=orders.filter(function(o){return o.status=='قيد الطلب'}),D=orders.filter(function(o){return o.status!='قيد الطلب'});
 var h='';
 if(phone().length<10)h='<div class="warn">اكتب رقم موبايلك في الصفحة الرئيسية لتظهر طلباتك.</div>';
 else if(tab==1){
  h+=P.length?P.map(ordHTML).join(''):'<div class="empty">لا يوجد طلب قيد الطلب</div>';
  h+='<div class="warn">يمكنك الطلب من أي مطعم في أي وقت، حتى في نفس اليوم. الطلب قيد الطلب لا يُستبدل إلا بعد تأكيد استلامه أو تعديلك له.</div><div class="btns"><button class="main" onclick="go(\'home\')">＋ ابدأ طلبًا جديدًا من مطعم</button></div>';
 }else h+=D.length?D.map(ordHTML).join(''):'<div class="empty">لا توجد طلبات قديمة بعد. تظهر هنا بعد تأكيد استلامها.</div>';
 $('ol').innerHTML=h;
}
$('tb1').onclick=function(){tab=1;drawOrders()};$('tb2').onclick=function(){tab=2;drawOrders()};
$('ol').addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 var id=b.dataset.id,act=b.dataset.act,o=orders.filter(function(x){return x.id==id})[0];if(!o)return;
 if(act=='edit'){
  var rid=Object.keys(R).filter(function(k){return R[k].name==o.restaurant})[0];if(!rid)return;
  sel={};(o.items||[]).forEach(function(i){sel[i.k]=i.q});
  ls('rest.sel.'+rid,JSON.stringify({sel:sel,os:o.note||'',edit:o.id}));go('rest',rid);return;
 }
 if(act=='cancel'&&!confirm('إلغاء هذا الطلب؟'))return;
 b.disabled=true;
 api('POST',{a:act=='rcv'?'receive':'cancel',id:id,phone:phone()}).then(function(r){
  if(!r||!r.ok)throw 0;return loadOrders(true);
 }).then(function(){if(act=='rcv'){tab=2;drawOrders();ost('تم تأكيد الاستلام. انتقل الطلب إلى طلباتك القديمة.')}else ost('تم إلغاء الطلب.')}).catch(function(){b.disabled=false;ost('لم يتم التنفيذ. حاول مرة أخرى.',true)});
});
/* ---------- boot ---------- */
$('nm').value=ls('rest.nm')||ls('salsa.nm')||'';$('ph').value=ls('rest.ph')||ls('salsa.ph')||'';
var start=OPEN||(location.hash||'').slice(1);
if(start&&R[start]&&R[start].menu)openRest(start);else go('home');
if(phone().length>=10)loadOrders(false).then(function(){updTag();if(cur)refresh()});
</script>
</body>
</html>
